plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.tekin.salavat'
    compileSdk 34

    defaultConfig {
        applicationId "com.tekin.salavat"
        minSdk 26
        targetSdk 34
        versionCode 1
        // Derleme numarasi surum adina eklenir ("0.1 · #12"): telefonda hangi
        // APK'nin kurulu oldugu okunabilsin.
        versionName "0.1" + (System.getenv("GITHUB_RUN_NUMBER") ? " · #" + System.getenv("GITHUB_RUN_NUMBER") : "")
    }

    // Depodaki sabit test anahtari: CI her kosuda yeni bir debug anahtari
    // uretseydi telefondaki APK uzerine kurulamazdi (imza farkli). Magaza
    // icin degil; yayin anahtari gerekince ayri ve gizli tutulacak.
    signingConfigs {
        debug {
            storeFile file("debug.keystore")
            storePassword "android"
            keyAlias "androiddebugkey"
            keyPassword "android"
        }
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    kotlinOptions {
        jvmTarget = '1.8'
    }

    testOptions {
        unitTests {
            // Robolectric'in uygulama baglamini (SharedPreferences, assets) kurabilmesi icin.
            includeAndroidResources = true
            returnDefaultValues = false
        }
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.13.1'
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'com.google.android.material:material:1.12.0'

    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.robolectric:robolectric:4.11.1'
    testImplementation 'androidx.test:core:1.5.0'
}

tasks.withType(Test).configureEach {
    testLogging {
        events "failed"
        exceptionFormat "full"
    }
    afterSuite { desc, result ->
        if (!desc.parent) {
            println "TEST OZETI: ${result.testCount} test | " +
                "${result.successfulTestCount} gecti | " +
                "${result.failedTestCount} basarisiz | " +
                "${result.skippedTestCount} atlandi"
        }
    }
}
