plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.tekin.salavat'
    compileSdk 34

    defaultConfig {
        applicationId "com.tekin.salavat"
        minSdk 26
        targetSdk 34
        versionCode 2
        // Derleme numarasi surum adina eklenir ("0.1 · #12"): telefonda hangi
        // APK'nin kurulu oldugu okunabilsin.
        versionName "0.2" + (System.getenv("GITHUB_RUN_NUMBER") ? " · #" + System.getenv("GITHUB_RUN_NUMBER") : "")
    }

    // Depodaki sabit test anahtari: CI her kosuda yeni bir debug anahtari
    // uretseydi telefondaki APK uzerine kurulamazdi (imza farkli). Magaza
    // icin degil; yayin anahtari gerekince ayri ve gizli tutulacak.
    signingConfigs {
        debug {
            storeFile file("debug.keystore")
            storePassword "android"
            keyAlias "androiddebugkey"
            keyPassword "android"
        }
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    kotlinOptions {
        jvmTarget = '1.8'
    }

    // Web uygulamasi (../web) derlemede APK'nin icine kopyalanir: assets/web/.
    sourceSets {
        main {
            assets.srcDir(new File(buildDir, "generated/webAssets"))
        }
    }
}

def copyWebAssets = tasks.register('copyWebAssets', Copy) {
    from(rootProject.file('web')) {
        exclude 'test/**', 'sw.js'
    }
    from('src/main/assets/salavat.json')
    into new File(buildDir, "generated/webAssets/web")
}
preBuild.dependsOn(copyWebAssets)

// Yalnizca Android'in kendi siniflari (WebView, Service); ek kutuphane yok.
dependencies {
    testImplementation 'junit:junit:4.13.2'
}

tasks.withType(Test).configureEach {
    testLogging {
        events "failed"
        exceptionFormat "full"
    }
    afterSuite { desc, result ->
        if (!desc.parent) {
            println "TEST OZETI: ${result.testCount} test | " +
                "${result.successfulTestCount} gecti | " +
                "${result.failedTestCount} basarisiz | " +
                "${result.skippedTestCount} atlandi"
        }
    }
}
