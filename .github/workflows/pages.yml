name: Web (GitHub Pages)

# web/ klasorunu ve hazir kayitlari (app/src/main/assets/salavat.json) siteye
# yayinlar. Telefonda adresi acip "Ana ekrana ekle" ile uygulama gibi kullanilir.
#
# Bir kez yapilacak ayar (repo sahibi): Settings → Pages → Source: "GitHub Actions".
# github-pages ortami yalnizca izin verilen dallardan yayin kabul eder; bu dal
# main degilse Settings → Environments → github-pages altinda dala izin verilir.
on:
  push:
    paths:
      - 'web/**'
      - 'app/src/main/assets/salavat.json'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - name: Kodu indir
        uses: actions/checkout@v5

      - name: Testler (ayırıcı, tespih süresi)
        run: |
          node web/test/parser.test.js
          node web/test/tasbih.test.js

      - name: Siteyi hazırla
        run: |
          mkdir _site
          cp -r web/* _site/
          rm -rf _site/test
          cp app/src/main/assets/salavat.json _site/
          # Yeni yayinda telefondaki onbellek yenilensin.
          sed -i "s/salavat-v[0-9]*/salavat-${GITHUB_SHA::7}/" _site/sw.js

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Yayınla
        id: deploy
        uses: actions/deploy-pages@v4
