name: Build APK

# Her push'ta debug APK. APK depodaki sabit test anahtariyla imzali
# (app/debug.keystore): yeni APK telefondakinin uzerine kurulur.
# Birim testleri her 10 kosuda bir (run_number 10'un kati) ya da
# "Run workflow"da elle isaretlenirse; diger kosularda APK derlemesi
# derleme hatasini yine yakalar.
on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      run_tests:
        description: 'Birim testlerini çalıştır'
        type: boolean
        default: false

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Kodu indir
        uses: actions/checkout@v5

      - name: Java kur
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Gradle önbelleği
        uses: gradle/actions/setup-gradle@v5

      - name: Test koşusu mu?
        id: tests
        run: |
          if [ "${{ inputs.run_tests }}" = "true" ] || [ $(( ${{ github.run_number }} % 10 )) -eq 0 ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            echo "Birim testleri bu koşuda çalışacak (koşu #${{ github.run_number }})."
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "Birim testleri atlandı (koşu #${{ github.run_number }}; her 10 koşuda bir ya da elle)."
          fi

      - name: Robolectric önbelleği
        if: ${{ steps.tests.outputs.run == 'true' }}
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository/org/robolectric
          key: robolectric-${{ runner.os }}-${{ hashFiles('app/build.gradle') }}
          restore-keys: robolectric-${{ runner.os }}-

      - name: Birim testleri
        if: ${{ steps.tests.outputs.run == 'true' }}
        run: ./gradlew testDebugUnitTest --stacktrace

      - name: Test raporunu yükle
        if: ${{ failure() && steps.tests.outputs.run == 'true' }}
        uses: actions/upload-artifact@v6
        with:
          name: unit-test-report
          path: app/build/reports/tests/
          if-no-files-found: ignore
          retention-days: 3

      - name: APK derle
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: APK'yı yükle
        uses: actions/upload-artifact@v6
        with:
          name: salavat-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
